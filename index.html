<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindSuite · Legacy Modernization</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#17253b;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
form{width:min(480px,100%)}
label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
input{width:100%;padding:14px 16px;font:inherit;font-size:18px;border:1px solid #ccd5e2;border-radius:10px;background:#fff;color:inherit}
input:focus{outline:3px solid #9cacff;outline-offset:2px;border-color:#395ddd}
</style></head><body>
<form onsubmit="return false">
<label for="project">Project name</label>
<input id="project" name="project" maxlength="120" autocomplete="off" autofocus>
</form>
<script>
const f=document.getElementById('project'),K='mindsuite-project-name';
try{f.value=localStorage.getItem(K)||''}catch{}
f.addEventListener('input',()=>{try{localStorage.setItem(K,f.value)}catch{}});
</script>
</body></html>
