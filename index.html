.count{font-size:12px;color:var(--muted);white-space:nowrap}

.card-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--line);margin-top:16px;background:#fcfcfd;border-radius:0 0 var(--radius) var(--radius)}
.hint{font-size:12px;color:var(--muted)}
table.sum{width:100%;border-collapse:collapse;font-size:13.5px}
.sum th{width:34%;text-align:left;font-weight:500;color:var(--muted);padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.sum td{padding:11px 0;border-bottom:1px solid var(--line);font-weight:600}.sum td small{display:block;font-weight:400;color:var(--muted)}
.sum td .linkbtn{margin-left:8px;font-weight:500}
.sum td.sumsec{padding:18px 0 6px;font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.notice{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}.rail{display:none}
 main{padding:16px}.card-h,.card-b{padding-left:16px;padding-right:16px}.card-f{padding:12px 16px}
 .grid{grid-template-columns:1fr}.crumb b{max-width:120px}.top{padding:0 16px;gap:10px}.top .chip{display:none}

@media(max-width:420px){.logo span{display:none}}

</div>

function exportJson(){
 const out={schemaVersion:2,project:S.project};
 for(const st of STEPS.slice(1)){const items=picked(st).map(o=>({id:o[0],label:o[1],source:o[3]||'catalog'}));out[st.key]=st.multi?items:(items[0]||null)}
 out.technology=out.technology.map(item=>({...item,layer:techLayer(item.id),details:S.technologyDetails[item.id]||''}));
 out.exportedAt=new Date().toISOString();
 const u=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));const a=el('a',{href:u,download:(S.project.replace(/[^\w-]+/g,'_')||'project')+'.json'});a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function summaryStep(){
 const rows=[];let sec='';
 STEPS.forEach((st,i)=>{
  if(st.sec!==sec){sec=st.sec;rows.push(el('tr',{},el('td',{colspan:'2',class:'sumsec',text:sec})))}
  const p=picked(st);
  rows.push(el('tr',{},[el('th',{text:st.title}),el('td',{},[st.key==='technology'?p.length+' components':label(st),el('button',{class:'linkbtn',type:'button',text:'Edit',onclick:()=>go(i)}),st.key==='technology'?el('ul',{class:'stack-summary'},p.map(o=>el('li',{text:o[1]+(S.technologyDetails[o[0]]?' — '+S.technologyDetails[o[0]]:'')}))):!st.multi&&p[0]?el('small',{text:p[0][2]}):null])]));
 });
 return el('div',{},[
  el('div',{class:'card-h'},[el('div',{class:'eyebrow',text:'Review'}),el('h1',{text:S.project}),el('p',{text:'Check the intake details before the assessment begins.'})]),
  el('div',{class:'card-b'},[el('table',{class:'sum'},el('tbody',{},rows)),el('div',{class:'notice',text:'Intake complete. Automated assessment by the MindSuite agent will be available in a later release.'})]),
  el('div',{class:'card-f'},[el('button',{class:'btn ghost',type:'button',text:'Back',onclick:()=>go(SUMMARY-1)}),el('span'),el('button',{class:'btn primary',type:'button',text:'Export JSON',onclick:exportJson})])]);
}
function render(){
 if(!reachable(cur))cur=firstOpen();
 renderTop();renderRail();renderPipe();
 const st=STEPS[cur];
 document.getElementById('card').replaceChildren(cur===SUMMARY?summaryStep():st.kind==='text'?textStep(st,cur):optionStep(st,cur));
}
document.getElementById('exportBtn').onclick=exportJson;
document.getElementById('newBtn').onclick=()=>{if(S.project&&!confirm('Start a new project? The current one will be cleared.'))return;S=blank();query={};ai={};techScope='recommended';techFilter='';cur=0;save();render()};
render();
</script>
</body></html>
