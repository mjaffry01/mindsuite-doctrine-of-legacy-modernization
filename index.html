function zipFolders(plan){const enc=new TextEncoder();const entries=[[plan.name+'/',null],[plan.name+'/README.txt',plan.readme]];for(const f of plan.folders){entries.push([plan.name+'/'+f.name+'/',null],[plan.name+'/'+f.name+'/What to put here.txt',f.readme]);}
 const T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0;}const crc=b=>{let c=0xFFFFFFFF;for(const x of b)c=T[(c^x)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
 const d=new Date();const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);const date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 const parts=[],central=[];let off=0;
 for(const [name,text] of entries){const nb=enc.encode(name);const data=text==null?new Uint8Array(0):enc.encode(text);const c=crc(data);
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);lh.setUint32(14,c,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
  parts.push(lh,nb,data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);ch.setUint32(16,c,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(38,text==null?0x10:0,true);ch.setUint32(42,off,true);
  central.push(ch,nb);off+=30+nb.length+data.length;}
 const cdSize=central.reduce((a,x)=>a+x.byteLength,0);const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);

// Database export parser. Reads the DBA's schema export (DDL) and/or the catalog query result (CSV) in this browser.
// Never reads business data: only object definitions, counts and sizes.
const DB_SCRIPTS={
 oracle:{name:'Oracle',file:'mindsuite_oracle_catalog.sql',run:'sql -s readonly_user@//host:1521/service @mindsuite_oracle_catalog.sql   (SQLcl or SQL*Plus 12.2+)',text:`-- MindSuite read-only catalog extract for Oracle (12c or later).
-- Needs: CREATE SESSION + SELECT_CATALOG_ROLE (or SELECT ANY DICTIONARY). Reads the data dictionary only; no business data.
SET MARKUP CSV ON QUOTE ON
SET FEEDBACK OFF
SET PAGESIZE 0 EMBEDDED ON
SPOOL mindsuite_oracle_catalog.csv
SELECT 'table' AS record_type, t.owner AS schema_name, t.table_name AS name, t.num_rows AS row_count,
       ROUND(NVL(s.mb,0),1) AS size_mb, NULL AS line_count, NULL AS detail
FROM dba_tables t
LEFT JOIN (SELECT owner, segment_name, SUM(bytes)/1048576 mb FROM dba_segments WHERE segment_type LIKE 'TABLE%' GROUP BY owner, segment_name) s
  ON s.owner = t.owner AND s.segment_name = t.table_name
WHERE t.owner NOT IN (SELECT username FROM dba_users WHERE oracle_maintained = 'Y')
UNION ALL
SELECT 'code', owner, name, NULL, NULL, COUNT(*), type FROM dba_source
WHERE owner NOT IN (SELECT username FROM dba_users WHERE oracle_maintained = 'Y') GROUP BY owner, name, type
UNION ALL
SELECT 'job', owner, job_name, NULL, NULL, NULL, repeat_interval FROM dba_scheduler_jobs
WHERE owner NOT IN (SELECT username FROM dba_users WHERE oracle_maintained = 'Y')
UNION ALL
SELECT 'link', owner, db_link, NULL, NULL, NULL, host FROM dba_db_links
UNION ALL
SELECT 'admin', NULL, grantee, NULL, NULL, NULL, granted_role FROM dba_role_privs WHERE granted_role = 'DBA';
SPOOL OFF
`},
 sqlserver:{name:'SQL Server',file:'mindsuite_sqlserver_catalog.sql',run:'sqlcmd -S server -d database -E -s "," -W -i mindsuite_sqlserver_catalog.sql -o mindsuite_sqlserver_catalog.csv',text:`-- MindSuite read-only catalog extract for SQL Server. Run in each application database.
-- Needs: VIEW DEFINITION, VIEW DATABASE STATE, read on msdb job tables, VIEW ANY DEFINITION for server roles. No business data is read.
SET NOCOUNT ON;
SELECT 'table' AS record_type, s.name AS schema_name, t.name AS name,
       SUM(CASE WHEN p.index_id IN (0,1) THEN p.row_count ELSE 0 END) AS row_count,
       CAST(SUM(p.reserved_page_count) * 8 / 1024.0 AS decimal(18,1)) AS size_mb, NULL AS line_count, NULL AS detail
FROM sys.tables t JOIN sys.schemas s ON s.schema_id = t.schema_id
JOIN sys.dm_db_partition_stats p ON p.object_id = t.object_id
GROUP BY s.name, t.name
UNION ALL
SELECT 'code', OBJECT_SCHEMA_NAME(m.object_id), OBJECT_NAME(m.object_id), NULL, NULL,
       LEN(m.definition) - LEN(REPLACE(m.definition, CHAR(10), '')) + 1, o.type_desc
FROM sys.sql_modules m JOIN sys.objects o ON o.object_id = m.object_id
UNION ALL
SELECT 'job', NULL, j.name, NULL, NULL, NULL, CASE j.enabled WHEN 1 THEN 'enabled' ELSE 'disabled' END FROM msdb.dbo.sysjobs j
UNION ALL
SELECT 'link', NULL, name, NULL, NULL, NULL, data_source FROM sys.servers WHERE is_linked = 1
UNION ALL
SELECT 'admin', NULL, l.name, NULL, NULL, NULL, 'sysadmin'
FROM sys.server_role_members rm
JOIN sys.server_principals r ON r.principal_id = rm.role_principal_id
JOIN sys.server_principals l ON l.principal_id = rm.member_principal_id
WHERE r.name = 'sysadmin';
`},
 postgresql:{name:'PostgreSQL',file:'mindsuite_postgresql_catalog.sql',run:'psql -d database --csv -f mindsuite_postgresql_catalog.sql -o mindsuite_postgresql_catalog.csv   (psql 12+)',text:`-- MindSuite read-only catalog extract for PostgreSQL 11+. Needs a role with pg_read_all_stats. No business data is read.
SELECT 'table' AS record_type, schemaname AS schema_name, relname AS name, n_live_tup AS row_count,
       round(pg_total_relation_size(relid) / 1048576.0, 1) AS size_mb, NULL::bigint AS line_count, NULL::text AS detail
FROM pg_stat_user_tables
UNION ALL
SELECT 'code', n.nspname, p.proname, NULL, NULL, array_length(string_to_array(p.prosrc, E'\\n'), 1),
       CASE p.prokind WHEN 'p' THEN 'PROCEDURE' ELSE 'FUNCTION' END
FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
UNION ALL
SELECT 'link', NULL, srvname, NULL, NULL, NULL, 'foreign server' FROM pg_foreign_server
UNION ALL
SELECT 'admin', NULL, rolname, NULL, NULL, NULL, 'superuser' FROM pg_roles WHERE rolsuper;
-- If pg_cron is installed, also run:
-- SELECT 'job' AS record_type, NULL AS schema_name, jobname AS name, NULL AS row_count, NULL AS size_mb, NULL AS line_count, schedule AS detail FROM cron.job;
`},
 mysql:{name:'MySQL / MariaDB',file:'mindsuite_mysql_catalog.sql',run:'mysql -h host -u readonly_user -p --batch < mindsuite_mysql_catalog.sql > mindsuite_mysql_catalog.tsv',text:`-- MindSuite read-only catalog extract for MySQL / MariaDB. Needs SELECT on information_schema and PROCESS. No business data is read.
-- Note: for InnoDB, TABLE_ROWS is an estimate.
SELECT 'table' AS record_type, TABLE_SCHEMA AS schema_name, TABLE_NAME AS name, TABLE_ROWS AS row_count,
       ROUND((DATA_LENGTH + INDEX_LENGTH) / 1048576, 1) AS size_mb, NULL AS line_count, TABLE_TYPE AS detail
FROM information_schema.TABLES WHERE TABLE_SCHEMA NOT IN ('mysql','information_schema','performance_schema','sys')
UNION ALL
SELECT 'code', ROUTINE_SCHEMA, ROUTINE_NAME, NULL, NULL, NULL, ROUTINE_TYPE FROM information_schema.ROUTINES WHERE ROUTINE_SCHEMA NOT IN ('mysql','sys')
UNION ALL
SELECT 'code', TRIGGER_SCHEMA, TRIGGER_NAME, NULL, NULL, NULL, 'TRIGGER' FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA NOT IN ('mysql','sys')
UNION ALL
SELECT 'job', EVENT_SCHEMA, EVENT_NAME, NULL, NULL, NULL, CONCAT(IFNULL(INTERVAL_VALUE,''), ' ', IFNULL(INTERVAL_FIELD,'')) FROM information_schema.EVENTS
UNION ALL
SELECT 'admin', NULL, GRANTEE, NULL, NULL, NULL, PRIVILEGE_TYPE FROM information_schema.USER_PRIVILEGES WHERE PRIVILEGE_TYPE = 'SUPER';
`},
 db2:{name:'Db2 (LUW)',file:'mindsuite_db2_catalog.sql',run:'db2 connect to DATABASE && db2 -tvf mindsuite_db2_catalog.sql   (run RUNSTATS first so CARD is filled)',text:`-- MindSuite read-only catalog extract for Db2 LUW. Needs SELECT on SYSCAT views. No business data is read.
-- CARD is -1 until RUNSTATS has been run. Output has no header row; MindSuite reads the column order.
EXPORT TO mindsuite_db2_catalog.csv OF DEL
SELECT 'table', TABSCHEMA, TABNAME, CARD, CAST(NULL AS DECIMAL(18,1)), CAST(NULL AS INTEGER), TYPE FROM SYSCAT.TABLES WHERE TABSCHEMA NOT LIKE 'SYS%'
UNION ALL
SELECT 'code', ROUTINESCHEMA, ROUTINENAME, CAST(NULL AS BIGINT), CAST(NULL AS DECIMAL(18,1)), CAST(NULL AS INTEGER), ROUTINETYPE FROM SYSCAT.ROUTINES WHERE ROUTINESCHEMA NOT LIKE 'SYS%'
UNION ALL
SELECT 'admin', CAST(NULL AS VARCHAR(128)), GRANTEE, CAST(NULL AS BIGINT), CAST(NULL AS DECIMAL(18,1)), CAST(NULL AS INTEGER), 'DBADM' FROM SYSCAT.DBAUTH WHERE DBADMAUTH = 'Y';
`}};
function downloadText(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));const a=h('a',{href:url,download:name});a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const REC_TYPES=new Set(['table','code','job','link','admin']);
function parseDelimited(text){const first=text.split(/\r?\n/).find(l=>l.trim()&&!/^-+[\s,|-]*$/.test(l))||'';const sep=first.includes('\t')?'\t':first.split(',').length>=first.split(';').length?',':';';const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}else if(c==='"')q=true;else if(c===sep){row.push(cell.trim());cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());cell='';if(row.some(x=>x!==''))rows.push(row);row=[];}else cell+=c;}
 row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);return rows.filter(r=>!/^-+$/.test(r[0]||''));}
function parseCatalogCsv(text){const rows=parseDelimited(text);if(!rows.length)return null;let start=0,cols=['record_type','schema_name','name','row_count','size_mb','line_count','detail'];const head=rows[0].map(x=>x.toLowerCase());
 if(head.includes('record_type')){cols=head;start=1;}else if(!REC_TYPES.has(head[0]))return null;const idx=k=>cols.indexOf(k);const num=v=>{const n=parseFloat(String(v??'').replace(/[\s,]/g,''));return isNaN(n)||n<0?null:n;};
 const out={tables:{},views:{},code:{},jobs:{},links:{},admins:{}};
 for(const r of rows.slice(start)){const t=(r[idx('record_type')]||'').toLowerCase();if(!REC_TYPES.has(t))continue;const sch=r[idx('schema_name')]||'';const nm=r[idx('name')]||'';if(!nm||nm.toUpperCase()==='NULL')continue;const full=(sch&&sch.toUpperCase()!=='NULL'?sch+'.':'')+nm;const detail=r[idx('detail')]||'';
  if(t==='table'){if(/view/i.test(detail))out.views[full]=1;else out.tables[full]={rows:num(r[idx('row_count')]),sizeMb:num(r[idx('size_mb')])};}
  if(t==='code'){const ty=(detail||'CODE').toUpperCase();out.code[full+(/BODY/.test(ty)?' (body)':'')]={type:ty,lines:num(r[idx('line_count')])};}
  if(t==='job')out.jobs[full]=detail&&detail.toUpperCase()!=='NULL'?detail:'';
  if(t==='link')out.links[full]=detail&&detail.toUpperCase()!=='NULL'?detail:'';
  if(t==='admin')out.admins[nm]=detail||'admin';}
 return out;}
function guessEngine(text){if(/VARCHAR2|NUMBER\(|PL\/SQL|CREATE\s+(OR\s+REPLACE\s+)?PACKAGE|DBMS_/i.test(text))return 'oracle';if(/\bNVARCHAR\b|\[dbo\]|^\s*GO\s*$|sp_add|IDENTITY\(/im.test(text))return 'sqlserver';if(/ENGINE\s*=\s*InnoDB|AUTO_INCREMENT|`\w+`/i.test(text))return 'mysql';if(/\bSERIAL\b|::\w+|LANGUAGE\s+plpgsql|CREATE\s+EXTENSION/i.test(text))return 'postgresql';if(/db2look|CONNECT\s+TO|ORGANIZE\s+BY|SYSCAT\./i.test(text))return 'db2';return '';}
function parseDdl(text){const out={tables:{},views:{},code:{},jobs:{},links:{},admins:{}};const nm=s=>s.replace(/["`\[\]]/g,'');
 for(const m of text.matchAll(/create\s+(?:global\s+temporary\s+|temporary\s+)?table\s+(?:if\s+not\s+exists\s+)?([\w$#."`\[\]]+)/gi))out.tables[nm(m[1])]=out.tables[nm(m[1])]||{rows:null,sizeMb:null};

 sampleURL.searchParams.delete('sample');
